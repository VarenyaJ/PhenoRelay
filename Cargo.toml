[workspace]
members = ["crates/phenorelay-core"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.85"

[workspace.dependencies]
phenopackets = { version = "0.2.2-post2", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"
