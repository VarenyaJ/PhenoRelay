<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PhenoRelay</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>PhenoRelay</h1>
        <p id="release">Loading release</p>
      </div>
      <label class="file-loader">
        Local Phenopackets
        <input id="file-input" type="file" multiple accept="application/json,.json">
      </label>
    </header>
    <main class="layout">
      <aside class="filters">
        <h2>Query</h2>
        <label>
          Feature
          <select id="feature">
            <option value="phenotype">Phenotype</option>
            <option value="disease">Disease</option>
            <option value="medical_action">Medical action</option>
          </select>
        </label>
        <label>
          Term
          <input id="term" value="HP:0001250">
        </label>
        <label>
          Granularity
          <select id="granularity">
            <option value="count">Count</option>
            <option value="existence">Existence</option>
          </select>
        </label>
        <button id="run-query">Run</button>
        <h2>Filters</h2>
        <label>
          Cohort
          <input id="filter-cohort" list="cohort-options">
        </label>
        <label>
          Phenotype
          <input id="filter-phenotype" list="phenotype-options" placeholder="HP:0001250">
        </label>
        <label>
          Phenotype presence
          <select id="filter-phenotype-presence">
            <option value="">Any</option>
            <option value="present">Present</option>
            <option value="excluded">Excluded</option>
          </select>
        </label>
        <label>
          Disease
          <input id="filter-disease" list="disease-options">
        </label>
        <label>
          Gene
          <input id="filter-gene" list="gene-options">
        </label>
        <label>
          Genomics
          <select id="filter-genomics">
            <option value="">Any</option>
            <option value="true">With interpretation</option>
            <option value="false">Without interpretation</option>
          </select>
        </label>
        <label>
          PMID
          <input id="filter-pmid" list="pmid-options">
        </label>
        <label>
          Text
          <input id="filter-text" placeholder="file, label, ID, variant">
        </label>
        <button id="apply-filters">Apply filters</button>
        <button id="clear-filters" class="secondary" type="button">Clear</button>
        <datalist id="cohort-options"></datalist>
        <datalist id="phenotype-options"></datalist>
        <datalist id="disease-options"></datalist>
        <datalist id="gene-options"></datalist>
        <datalist id="pmid-options"></datalist>
      </aside>
      <section class="panel">
        <nav class="tabs">
          <button data-tab="overview" class="active">Overview</button>
          <button data-tab="terms">Terms</button>
          <button data-tab="records">Individuals</button>
          <button data-tab="local">Local files</button>
        </nav>
        <div id="content"></div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
