name: Release readiness

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/release.yml
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - .github/workflows/release.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-package:
    name: Cargo package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish -p phenorelay-core --dry-run --locked
